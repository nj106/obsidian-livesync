# Headless Self-hosted LiveSync CLI daemon: keeps a plaintext copy of the vault in volume livesync_vault
# so Hark can read/write notes; changes sync both ways with CouchDB (stack livesync).
# Settings + local PouchDB live in livesync_cli_data (/data/settings.json, bootstrapped once from a Setup URI).
services:
  livesync-cli:
    image: ghcr.io/vrtmrz/livesync-cli:latest
    container_name: livesync-cli
    restart: unless-stopped
    command: ["--settings", "/data/settings.json", "--vault", "/vault", "daemon"]
    volumes:
      - livesync_cli_data:/data
      - livesync_vault:/vault
    networks:
      - livesync-cli-net
    healthcheck:
      test: ["CMD-SHELL", "grep -q index.cjs /proc/1/cmdline || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  livesync_cli_data:
    name: livesync_cli_data
    external: true
  livesync_vault:
    name: livesync_vault
    external: true

networks:
  livesync-cli-net:
    driver: bridge
